<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lezl0w — Jailbreak</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    min-height:100vh;
    background:#000 url("img.jpg") center/cover fixed;
    color:#c8ced8;font:14px/1.4 Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:16px;text-align:center;
  }
  .box{
    background:rgba(0,0,0,.78);padding:20px;border-radius:8px;
    max-width:420px;width:100%;
  }
  h1{font-size:20px;color:#fff;margin:0 0 12px;letter-spacing:3px}
  #fw{
    font-size:12px;color:#888;margin:0 0 14px;
    padding:6px 10px;background:#0a0c10;border:1px solid #333;
    border-radius:4px;display:inline-block;letter-spacing:1px;
  }
  #fw.ok{color:#4ade80;border-color:#2a5a3a}
  #fw.bad{color:#f87171;border-color:#5a2a2a}

  #status{
    padding:10px;background:#0a0c10;border:1px solid #333;
    border-radius:6px;font-size:13px;color:#888;
    margin:0 0 12px;
  }
  #status.ok{color:#4ade80;border-color:#2a5a3a}
  #status.bad{color:#f87171;border-color:#5a2a2a}
  #status.warn{color:#facc15;border-color:#5a4a2a}

  /* Debug en vivo */
  #debug{
    background:#050608;border:1px solid #1a1f28;border-radius:6px;
    padding:10px 12px;text-align:left;
  }
  #debugTop{
    display:flex;justify-content:space-between;align-items:center;
    font:700 10.5px Arial;letter-spacing:1.5px;
    color:#666;margin-bottom:8px;text-transform:uppercase;
  }
  #debugPct{color:#6fcb99}
  #debugBar{
    height:4px;background:#1a1a1a;border-radius:999px;
    overflow:hidden;margin-bottom:10px;
  }
  #debugFill{
    height:100%;width:0%;background:#6fcb99;
    transition:width .3s ease;
  }
  #debugLog{
    font:10.5px/1.6 Consolas,monospace;color:#5c6672;
    height:220px;overflow-y:auto;
    white-space:pre-wrap;word-wrap:break-word;
  }
  #debugLog::-webkit-scrollbar{width:4px}
  #debugLog::-webkit-scrollbar-thumb{background:#1e2732;border-radius:2px}
  #debugLog div{margin:0;padding:0}
  #debugLog .ok{color:#7fd0a0}
  #debugLog .bad{color:#d08a7f}
  #debugLog .warn{color:#d8c07f}
  #debugLog .info{color:#9fb3d0}
  #debugLog .time{color:#3a4450}
</style>
</head>
<body>

<div class="box">
  <h1>Lezl0w</h1>
  <div id="fw">Detectando…</div>
  <div id="status">Ready</div>

  <div id="debug">
    <div id="debugTop">
      <span>Debug</span>
      <span id="debugPct">0%</span>
    </div>
    <div id="debugBar"><div id="debugFill"></div></div>
    <div id="debugLog"></div>
  </div>
</div>

<script>
(function(){
  var fwEl   = document.getElementById('fw'),
      st     = document.getElementById('status'),
      pct    = document.getElementById('debugPct'),
      fill   = document.getElementById('debugFill'),
      logBox = document.getElementById('debugLog');

  /* ---------- Log con timestamp ---------- */
  function addLog(msg, cls){
    var t = new Date();
    var ts = String(t.getHours()).padStart(2,'0') + ':' +
             String(t.getMinutes()).padStart(2,'0') + ':' +
             String(t.getSeconds()).padStart(2,'0');
    var d = document.createElement('div');
    d.innerHTML = '<span class="time">[' + ts + ']</span> ' +
                  '<span class="' + (cls || '') + '">' + msg + '</span>';
    logBox.appendChild(d);
    logBox.scrollTop = logBox.scrollHeight;
  }

  function setProgress(p){
    fill.style.width = p + '%';
    pct.textContent = p + '%';
  }

  function setStatus(txt, cls){
    st.textContent = txt;
    st.className = cls || '';
  }

  /* ---------- Detección de firmware ---------- */
  var ua = (navigator.userAgent || '').replace(/\s+/g,' ');
  var m  = ua.match(/PlayStation\s*4[\/\s]([\d.]+)/i);
  var fw = m ? m[1] : null;

  addLog('Lezl0w boot v1.0', 'info');
  setProgress(5);

  if(!fw){
    fwEl.textContent = 'No es PS4';
    fwEl.className = 'bad';
    setStatus('Dispositivo no soportado', 'bad');
    addLog('❌ No se detectó PlayStation 4', 'bad');
    addLog('UA: ' + ua.substring(0, 70), 'time');
    setProgress(100);
    return;
  }

  var parts = fw.split('.');
  if(parts.length === 2 && parts[1].length === 1){
    fw = parts[0] + '.' + parts[1] + '0';
  }

  var SOPORTADAS = ['10.00','10.50','11.00','11.02','13.00','13.02','13.52'];
  var ok = SOPORTADAS.indexOf(fw) !== -1;

  fwEl.textContent = 'PS4 ' + fw;
  fwEl.className = ok ? 'ok' : 'bad';

  addLog('Firmware detectado: <b>PS4 ' + fw + '</b>', 'ok');
  setProgress(15);

  if(!ok){
    setStatus('Firmware no soportado', 'bad');
    addLog('❌ Firmware no soportado', 'bad');
    addLog('Soportados: ' + SOPORTADAS.join(', '), 'warn');
    setProgress(100);
    return;
  }

  addLog('✅ Firmware compatible', 'ok');
  setStatus('Iniciando exploit…', 'warn');
  setProgress(25);

  /* ---------- Cargar el exploit real ---------- */
  addLog('Cargando jb.js…', 'info');

  var s = document.createElement('script');
  s.type = 'module';
  s.src = './jb.js?v=' + Date.now();

  s.onload = function(){
    addLog('✅ jb.js cargado', 'ok');
    setProgress(40);
    addLog('Esperando ejecución del exploit…', 'info');

    /* Si jb.js expone doJb() o similar, lo llamamos */
    setTimeout(function(){
      try {
        if(typeof window.doJb === 'function'){
          addLog('Ejecutando doJb()…', 'warn');
          setProgress(55);
          window.doJb();
        } else if(typeof window.startExploit === 'function'){
          addLog('Ejecutando startExploit()…', 'warn');
          setProgress(55);
          window.startExploit();
        } else if(typeof window.jb === 'function'){
          addLog('Ejecutando jb()…', 'warn');
          setProgress(55);
          window.jb();
        } else {
          addLog('⚠ jb.js cargado (auto-ejecución)', 'warn');
          setProgress(55);
        }
      } catch(e){
        addLog('❌ Error: ' + e.message, 'bad');
        setStatus('Error', 'bad');
        setProgress(100);
      }
    }, 800);
  };

  s.onerror = function(){
    addLog('❌ No se pudo cargar jb.js', 'bad');
    setStatus('Error cargando jb.js', 'bad');
    setProgress(100);
  };

  document.head.appendChild(s);

  /* ---------- Reflejar logs reales de misc.js ---------- */
  /* misc.js escribe en #console (que crea automáticamente).
     Lo monitorizamos para ver qué pasa en vivo. */
  var observer = new MutationObserver(function(){
    var con = document.getElementById('console');
    if(!con) return;

    /* Solo procesamos las líneas nuevas */
    var lines = con.textContent.split('\n');
    for(var i = observer.lastLen || 0; i < lines.length; i++){
      var line = lines[i].trim();
      if(!line) continue;

      /* Clasificar por tipo */
      var cls = 'info';
      if(line.indexOf('[+]') === 0) cls = 'ok';
      else if(line.indexOf('[-]') === 0) cls = 'bad';
      else if(line.indexOf('[*]') === 0) cls = 'info';

      /* Reflejar en el debug */
      var d = document.createElement('div');
      var t = new Date();
      var ts = String(t.getHours()).padStart(2,'0') + ':' +
               String(t.getMinutes()).padStart(2,'0') + ':' +
               String(t.getSeconds()).padStart(2,'0');
      d.innerHTML = '<span class="time">[' + ts + ']</span> ' +
                    '<span class="' + cls + '">' + line + '</span>';
      logBox.appendChild(d);
      logBox.scrollTop = logBox.scrollHeight;
    }
    observer.lastLen = lines.length;
  });
  observer.lastLen = 0;
  observer.observe(document.body, { childList: true, subtree: true, characterData: true });

  /* ---------- Reaccionar a body.done / body.fail ---------- */
  var statusObs = new MutationObserver(function(){
    if(document.body.classList.contains('done')){
      fill.style.width = '100%';
      pct.textContent = '100%';
      addLog('✅ Completado', 'ok');
      setStatus('Completado ✓', 'ok');
    }
    if(document.body.classList.contains('fail')){
      fill.style.width = '100%';
      pct.textContent = '100%';
      addLog('❌ Falló el exploit', 'bad');
      setStatus('Error — reinicia la consola', 'bad');
    }
  });
  statusObs.observe(document.body, {attributes:true, attributeFilter:['class']});

})();
</script>

</body>
</html>
